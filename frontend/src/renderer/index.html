<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Novel Forge</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!--
      Note: The actually effective CSP is uniformly overridden in vite.config.web.ts by the html-transform plugin.
      Keep it consistent here, relaxing connect-src so that any backend host can be accessed during LAN / server deployment.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src * https://api.github.com; img-src 'self' data:"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
